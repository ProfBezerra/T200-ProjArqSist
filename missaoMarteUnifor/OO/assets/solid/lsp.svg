  <text x="160" y="75" font-size="16" fill="#0F172A" text-anchor="middle" font-family="Segoe UI, Roboto">Produto (base)</text>
  <rect x="310" y="80" width="180" height="60" rx="8" fill="#ffffff" stroke="#CBD5E1"/>
